<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Portfolio Engineering — PRODUCT DIAGRAM</title><desc id="desc">Portfolio Engineering: Recurring need: Identify a shared problem → Integration boundary: Define extension points → Reusable component: Isolate responsibilities → Consumer project: Check adoption in context.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#A7503D" stroke-width="1.4"/></marker></defs><rect width="1600" height="900" fill="#F1EADF"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="83" fill="#936C42" font-size="19" font-weight="700">PRODUCT DIAGRAM</text><text x="1460" y="83" fill="#936C42" font-size="19" font-weight="700">10</text><path d="M80 108 H1520" stroke="#936C42"/><text x="80" y="205" fill="#292722" font-size="62" font-weight="700">Portfolio Engineering</text><text x="80" y="262" fill="#776B5B" font-size="30" font-weight="400">Turn recurring problems into reusable components.</text><rect x="80" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="80" y="360" width="330" height="7" fill="#936C42"/><text x="105" y="415" fill="#936C42" font-size="20" font-weight="700">01</text><text x="105" y="470" fill="#292722" font-size="27" font-weight="700">Recurring need</text><text x="105" y="550" fill="#776B5B" font-size="24" font-weight="400">Identify a shared problem</text><path d="M420 503 H440" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="450" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="450" y="360" width="330" height="7" fill="#936C42"/><text x="475" y="415" fill="#936C42" font-size="20" font-weight="700">02</text><text x="475" y="470" fill="#292722" font-size="27" font-weight="700">Integration boundary</text><text x="475" y="550" fill="#7