<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">SurvivalUnreal — SCHÉMA DU PRODUIT</title><desc id="desc">SurvivalUnreal: Systèmes Unreal: Organiser les composants propres au projet → SKContracts: Définir les échanges client-serveur → SKZoneNet: Relier le client au réseau de zone → SKOnline et .NET: Connecter les services et les états en ligne.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#A7503D" stroke-width="1.4"/></marker></defs><rect width="1600" height="900" fill="#F1EADF"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="83" fill="#936C42" font-size="19" font-weight="700">SCHÉMA DU PRODUIT</text><text x="1460" y="83" fill="#936C42" font-size="19" font-weight="700">33</text><path d="M80 108 H1520" stroke="#936C42"/><text x="80" y="205" fill="#292722" font-size="62" font-weight="700">SurvivalUnreal</text><text x="80" y="262" fill="#776B5B" font-size="30" font-weight="400">Un monde de survie relié à ses propres services de jeu.</text><rect x="80" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="80" y="360" width="330" height="7" fill="#936C42"/><text x="105" y="415" fill="#936C42" font-size="20" font-weight="700">01</text><text x="105" y="470" fill="#292722" font-size="27" font-weight="700">Systèmes Unreal</text><text x="105" y="550" fill="#776B5B" font-size="24" font-weight="400">Organiser les composants</text><text x="105" y="581" fill="#776B5B" font-size="24" font-weight="400">propres au projet</text><path d="M420 503 H440" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="450" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="450" y="360" width="330" height="7" fill="#936C42"/><text x="475" y="415" fill="#936C42" font-size="20" font-weight="700">02</text><text x="475" y="470" fill="#292722" font-size="27" font-weight="700">SKContracts</text><text x="475" y="550" fill="#776B5B" font-size="24" font-weight="400">Définir les échanges</text><text x="475" y="581" fill="#776B5B" font-size="24" font-weight="400">client-serveur</text><path d="M790 503 H810" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="820" y="360" width="330" height="7" fill="#936C42"/><text x="845" y="415" fill="#936C42" font-size="20" font-weight="700">03</text><text x="845" y="470" fill="#292722" font-size="27" font-weight="700">SKZoneNet</text><text x="845" y="550" fill="#776B5B" font-size="24" font-weight="400">Relier le client au réseau</text><text x="845" y="581" fill="#776B5B" font-size="24" font-weight="400">de zone</text><path d="M1160 503 H1180" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1190" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="1190" y="360" width="330" height="7" fill="#A7503D"/><text x="1215" y="415" fill="#936C42" font-size="20" font-weight="700">04</text><text x="1215" y="470" fill="#292722" font-size="27" font-weight="700">SKOnline et .NET</text><text x="1215" y="550" fill="#776B5B" font-size="24" font-weight="400">Connecter les services et</text><text x="1215" y="581" fill="#776B5B" font-size="24" font-weight="400">les états en ligne</text><path d="M80 716 H1520" stroke="#C7B8A2"/><text x="80" y="762" fill="#936C42" font-size="17" font-weight="700">REPÈRES DU SYSTÈME</text><text x="80" y="806" fill="#292722" font-size="25" font-weight="400">Des contrats entre les couches · Un réseau de zones dédié · Le HUD participe au parcours de jeu</text><text x="80" y="863" fill="#776B5B" font-size="18" font-weight="400">Architecture et parcours représentés à partir des sources du projet.</text></g></svg>