<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">RoadTripper — SCHÉMA DU PRODUIT</title><desc id="desc">RoadTripper: Journées: Composer les étapes du voyage → Programme et carte: Partager la journée et la sélection → Groupe et voitures: Organiser participants et déplacements → Carnet pratique: Réunir budget, documents et réservations.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#A7503D" stroke-width="1.4"/></marker></defs><rect width="1600" height="900" fill="#F1EADF"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="83" fill="#936C42" font-size="19" font-weight="700">SCHÉMA DU PRODUIT</text><text x="1460" y="83" fill="#936C42" font-size="19" font-weight="700">05</text><path d="M80 108 H1520" stroke="#936C42"/><text x="80" y="205" fill="#292722" font-size="62" font-weight="700">RoadTripper</text><text x="80" y="262" fill="#776B5B" font-size="30" font-weight="400">Un programme commun, une carte et un copilote pour voyager à plusieurs.</text><rect x="80" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="80" y="360" width="330" height="7" fill="#936C42"/><text x="105" y="415" fill="#936C42" font-size="20" font-weight="700">01</text><text x="105" y="470" fill="#292722" font-size="27" font-weight="700">Journées</text><text x="105" y="550" fill="#776B5B" font-size="24" font-weight="400">Composer les étapes du</text><text x="105" y="581" fill="#776B5B" font-size="24" font-weight="400">voyage</text><path d="M420 503 H440" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="450" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="450" y="360" width="330" height="7" fill="#936C42"/><text x="475" y="415" fill="#936C42" font-size="20" font-weight="700">02</text><text x="475" y="470" fill="#292722" font-size="27" font-weight="700">Programme et carte</text><text x="475" y="550" fill="#776B5B" font-size="24" font-weight="400">Partager la journée et la</text><text x="475" y="581" fill="#776B5B" font-size="24" font-weight="400">sélection</text><path d="M790 503 H810" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="820" y="360" width="330" height="7" fill="#936C42"/><text x="845" y="415" fill="#936C42" font-size="20" font-weight="700">03</text><text x="845" y="470" fill="#292722" font-size="27" font-weight="700">Groupe et voitures</text><text x="845" y="550" fill="#776B5B" font-size="24" font-weight="400">Organiser participants et</text><text x="845" y="581" fill="#776B5B" font-size="24" font-weight="400">déplacements</text><path d="M1160 503 H1180" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1190" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="1190" y="360" width="330" height="7" fill="#A7503D"/><text x="1215" y="415" fill="#936C42" font-size="20" font-weight="700">04</text><text x="1215" y="470" fill="#292722" font-size="27" font-weight="700">Carnet pratique</text><text x="1215" y="550" fill="#776B5B" font-size="24" font-weight="400">Réunir budget, documents</text><text x="1215" y="581" fill="#776B5B" font-size="24" font-weight="400">et réservations</text><path d="M80 716 H1520" stroke="#C7B8A2"/><text x="80" y="762" fill="#936C42" font-size="17" font-weight="700">REPÈRES DU SYSTÈME</text><text x="80" y="806" fill="#292722" font-size="25" font-weight="400">Le jour reste le point d&#x27;ancrage · Un calcul commun au client et au serveur · Les propositions suivent la révision du carnet</text><text x="80" y="863" fill="#776B5B" font-size="18" font-weight="400">Architecture et parcours représentés à partir des sources du projet.</text></g></svg>