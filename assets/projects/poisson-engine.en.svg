<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Poisson Engine — PRODUCT DIAGRAM</title><desc id="desc">Poisson Engine: Agents and genes: Define simulation behaviour → Spatial index: Group nearby agents → WebGPU / CPU compute: Calculate life and movement → Rendering and play: WebGL / Canvas interactions.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#A7503D" stroke-width="1.4"/></marker></defs><rect width="1600" height="900" fill="#F1EADF"/><g font-family="Arial, Helvetica, sans-serif"><text x="80" y="83" fill="#936C42" font-size="19" font-weight="700">PRODUCT DIAGRAM</text><text x="1460" y="83" fill="#936C42" font-size="19" font-weight="700">06</text><path d="M80 108 H1520" stroke="#936C42"/><text x="80" y="205" fill="#292722" font-size="62" font-weight="700">Poisson Engine</text><text x="80" y="262" fill="#776B5B" font-size="30" font-weight="400">A living ecosystem simulated in the browser.</text><rect x="80" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="80" y="360" width="330" height="7" fill="#936C42"/><text x="105" y="415" fill="#936C42" font-size="20" font-weight="700">01</text><text x="105" y="470" fill="#292722" font-size="27" font-weight="700">Agents and genes</text><text x="105" y="550" fill="#776B5B" font-size="24" font-weight="400">Define simulation</text><text x="105" y="581" fill="#776B5B" font-size="24" font-weight="400">behaviour</text><path d="M420 503 H440" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="450" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="450" y="360" width="330" height="7" fill="#936C42"/><text x="475" y="415" fill="#936C42" font-size="20" font-weight="700">02</text><text x="475" y="470" fill="#292722" font-size="27" font-weight="700">Spatial index</text><text x="475" y="550" fill="#776B5B" font-size="24" font-weight="400">Group nearby agents</text><path d="M790 503 H810" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="820" y="360" width="330" height="7" fill="#936C42"/><text x="845" y="415" fill="#936C42" font-size="20" font-weight="700">03</text><text x="845" y="470" fill="#292722" font-size="27" font-weight="700">WebGPU / CPU</text><text x="845" y="505" fill="#292722" font-size="27" font-weight="700">compute</text><text x="845" y="550" fill="#776B5B" font-size="24" font-weight="400">Calculate life and</text><text x="845" y="581" fill="#776B5B" font-size="24" font-weight="400">movement</text><path d="M1160 503 H1180" stroke="#A7503D" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1190" y="360" width="330" height="288" rx="3" fill="#FBF7F0" stroke="#C7B8A2"/><rect x="1190" y="360" width="330" height="7" fill="#A7503D"/><text x="1215" y="415" fill="#936C42" font-size="20" font-weight="700">04</text><text x="1215" y="470" fill="#292722" font-size="27" font-weight="700">Rendering and play</text><text x="1215" y="550" fill="#776B5B" font-size="24" font-weight="400">WebGL / Canvas</text><text x="1215" y="581" fill="#776B5B" font-size="24" font-weight="400">interactions</text><path d="M80 716 H1520" stroke="#C7B8A2"/><text x="80" y="762" fill="#936C42" font-size="17" font-weight="700">SYSTEM NOTES</text><text x="80" y="806" fill="#292722" font-size="25" font-weight="400">Compute and rendering adapt independently · Organize data for parallel execution · Simulation becomes a playground</text><text x="80" y="863" fill="#776B5B" font-size="18" font-weight="400">Architecture and workflows drawn from project sources.</text></g></svg>